name: ECS CodeDeploy Blue/Green

on:
  workflow_call:
    inputs:
      cluster_name:
        description: 'ECS cluster name'
        required: true
        type: string
      service_name:
        description: 'ECS service name'
        required: true
        type: string
      task_family:
        description: 'ECS task definition family'
        required: true
        type: string
      container_name:
        description: 'Container name in task definition'
        required: true
        type: string
      container_port:
        description: 'Container port'
        required: false
        type: number
        default: 3000
      ecr_repository:
        description: 'ECR repository name'
        required: true
        type: string
      image_tag:
        description: 'Docker image tag'
        required: true
        type: string
      codedeploy_application:
        description: 'CodeDeploy application name'
        required: true
        type: string
      codedeploy_deployment_group:
        description: 'CodeDeploy deployment group name'
        required: true
        type: string
      appspec_path:
        description: 'Path to appspec.yaml in service repository'
        required: false
        type: string
        default: 'terraform/appspec.yaml'
      deployment_config:
        description: 'CodeDeploy deployment config (e.g. ECSLinear10PercentEvery1Minutes, ECSAllAtOnce)'
        required: false
        type: string
        default: 'CodeDeployDefault.ECSLinear10PercentEvery1Minutes'
      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'eu-central-1'
    secrets:
      AWS_ROLE_ARN:
        description: 'AWS IAM Role ARN for OIDC authentication'
        required: true
    outputs:
      deployment_id:
        description: 'CodeDeploy deployment ID'
        value: ${{ jobs.deploy.outputs.deployment_id }}
      task_definition_arn:
        description: 'New task definition ARN'
        value: ${{ jobs.deploy.outputs.task_def_arn }}

permissions:
  id-token: write    # Required for OIDC
  contents: read     # Required for checkout

jobs:
  deploy:
    name: Deploy to ECS via CodeDeploy
    runs-on: ubuntu-latest
    outputs:
      deployment_id: ${{ steps.create-deployment.outputs.deployment_id }}
      task_def_arn: ${{ steps.register-taskdef.outputs.task_def_arn }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: GitHubActions-ECS-CodeDeploy

      # INVEST-005/EPIC-017/FEATURE-002/US-007 — **wait, do not abort.**
      #
      # This used to `exit 1` the moment another deployment was in progress, which turned an
      # ordinary queue into a failed pipeline — and a failed pipeline here could not be completed by
      # re-running it (see `reusable-release-ecr.yml`'s own note). render #435 is what that costs:
      # merged, green, and not running.
      #
      # **Waiting here is not made redundant by the `concurrency` group on the calling workflow.**
      # That group ends when the run ends, and CodeDeploy's blue/green termination wait outlives it:
      # the deployment group is still busy after the pipeline that started it has gone home. Only a
      # question put to CodeDeploy itself sees that.
      - name: 🔍 Wait for any active deployment to finish
        id: check-active
        env:
          # Longer than a blue/green termination wait, short enough that a stuck deployment is a
          # failed job rather than an hour of a runner. A ceiling somebody chose, not a loop.
          MAX_WAIT_SECONDS: '1800'
          POLL_SECONDS: '20'
        run: |
          WAITED=0
          while :; do
            ACTIVE=$(aws deploy list-deployments \
              --application-name ${{ inputs.codedeploy_application }} \
              --deployment-group-name ${{ inputs.codedeploy_deployment_group }} \
              --include-only-statuses InProgress \
              --output json | jq -r '.deployments[0] // empty')

            if [ -z "$ACTIVE" ]; then
              if [ "$WAITED" -gt 0 ]; then
                echo "✅ The deployment group is free after ${WAITED}s — continuing."
              else
                echo "✅ No active deployments found"
              fi
              break
            fi

            if [ "$WAITED" -ge "$MAX_WAIT_SECONDS" ]; then
              echo "::error::Deployment $ACTIVE has been in progress for more than ${MAX_WAIT_SECONDS}s."
              echo "This job waited rather than failing immediately, and has now given up. Either"
              echo "that deployment is stuck and wants a person, or the ceiling is too low for this"
              echo "service's termination wait."
              exit 1
            fi

            echo "⏳ Deployment $ACTIVE is in progress — waited ${WAITED}s of ${MAX_WAIT_SECONDS}s."
            sleep "$POLL_SECONDS"
            WAITED=$((WAITED + POLL_SECONDS))
          done

      - name: 📦 Download current Task Definition
        id: download-taskdef
        run: |
          echo "Downloading Task Definition: ${{ inputs.task_family }}"
          aws ecs describe-task-definition \
            --task-definition ${{ inputs.task_family }} \
            --query 'taskDefinition' > task-def.json
          
          echo "Current Task Definition:"
          cat task-def.json | jq -r '.family + ":" + (.revision|tostring)'

      - name: 🏗️ Build ECR image URI
        id: build-image-uri
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com/${{ inputs.ecr_repository }}:${{ inputs.image_tag }}"
          echo "image_uri=$ECR_URI" >> $GITHUB_OUTPUT
          echo "ECR Image: $ECR_URI"

      - name: 🔄 Update Task Definition with new image
        id: update-taskdef
        run: |
          echo "Updating container image to: ${{ steps.build-image-uri.outputs.image_uri }}"
          
          # Update image for specified container
          jq --arg IMAGE "${{ steps.build-image-uri.outputs.image_uri }}" \
             --arg CONTAINER "${{ inputs.container_name }}" \
             '(.containerDefinitions[] | select(.name == $CONTAINER) | .image) = $IMAGE' \
             task-def.json > updated-task-def.json
          
          # Remove read-only fields
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' updated-task-def.json > new-task-def.json
          
          echo "Updated Task Definition:"
          cat new-task-def.json | jq -r '.family'

      - name: 📝 Register new Task Definition
        id: register-taskdef
        run: |
          echo "Registering new Task Definition..."
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "✅ Registered: $TASK_DEF_ARN"

      - name: 📄 Load AppSpec from service repository
        id: load-appspec
        run: |
          APPSPEC_PATH="${{ inputs.appspec_path }}"
          
          if [ ! -f "$APPSPEC_PATH" ]; then
            echo "❌ AppSpec not found at: $APPSPEC_PATH"
            echo "Service must provide appspec.yaml (Service Ownership)"
            exit 1
          fi
          
          echo "Loading AppSpec from: $APPSPEC_PATH"
          cp "$APPSPEC_PATH" appspec.yaml
          
          echo "AppSpec content:"
          cat appspec.yaml

      - name: 🔧 Replace Task Definition placeholder in AppSpec
        id: update-appspec
        run: |
          TASK_DEF_ARN="${{ steps.register-taskdef.outputs.task_def_arn }}"
          
          echo "Replacing <TASK_DEFINITION> with: $TASK_DEF_ARN"
          sed -i "s|<TASK_DEFINITION>|$TASK_DEF_ARN|g" appspec.yaml
          
          echo "Updated AppSpec:"
          cat appspec.yaml

      - name: 🚀 Create CodeDeploy deployment
        id: create-deployment
        run: |
          echo "Creating CodeDeploy deployment..."
          
          # Create revision JSON with proper escaping
          APPSPEC_CONTENT=$(cat appspec.yaml)
          REVISION_JSON=$(jq -n \
            --arg content "$APPSPEC_CONTENT" \
            '{
              revisionType: "AppSpecContent",
              appSpecContent: {
                content: $content
              }
            }')
          
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ inputs.codedeploy_application }} \
            --deployment-group-name ${{ inputs.codedeploy_deployment_group }} \
            --deployment-config-name ${{ inputs.deployment_config }} \
            --description "Deploy ${{ inputs.image_tag }} via GitHub Actions" \
            --revision "$REVISION_JSON" \
            --query 'deploymentId' \
            --output text)
          
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          echo "✅ Deployment created: $DEPLOYMENT_ID"
          
          # AWS Console link
          CONSOLE_URL="https://${{ inputs.aws_region }}.console.aws.amazon.com/codesuite/codedeploy/deployments/$DEPLOYMENT_ID"
          echo "console_url=$CONSOLE_URL" >> $GITHUB_OUTPUT
          echo "🔗 Console: $CONSOLE_URL"

      # INVEST-005/EPIC-017/FEATURE-002/US-089 — **wait for the real outcome, not a 3-minute guess.**
      #
      # This step used to give up after 3 minutes and report success either way (the "Hybrid
      # Strategy"), on the theory that a longer blue/green shift "continues in background". It does
      # — but every job gated on this one via `needs: deploy` (every Lambda-deploy job in every
      # consuming service) started the moment that early, unconfirmed green appeared, not when
      # CodeDeploy actually decided. On 2026-10-17 that let `vehicle-manager`'s
      # `recheck-vehicle-manager-production` Lambda keep running a release CodeDeploy had already
      # rolled back, for hours, because this step told it the deployment was done.
      #
      # The ceiling is now 1800s (30 min) — comfortably past any real rollout plus its termination
      # wait (render's linear rollout is the slowest consumer at ~10 min; vehicle-manager's
      # ECSAllAtOnce + 5-min termination wait is faster) — and exceeding it is now itself a failure,
      # not a silent "could not verify, that's normal". A deployment that has not resolved in 30
      # minutes needs a person, same judgment the "wait for any active deployment" step above
      # already makes about its own ceiling.
      #
      # **This does not slow down the fast path.** `aws deploy wait` already returns the moment the
      # real status resolves — at 30s or at 25 minutes — so raising the ceiling from 180s to 1800s
      # changes nothing for a deployment that already finishes inside the old window.
      - name: ⏱️ Wait for the deployment's confirmed outcome
        id: wait-deployment
        continue-on-error: true  # The summary + fail-on-error steps below decide the job's fate
        run: |
          DEPLOYMENT_ID="${{ steps.create-deployment.outputs.deployment_id }}"

          echo "Waiting for the deployment to resolve (max 30 minutes)..."

          # Wait max 1800 seconds (30 minutes) for CodeDeploy's own terminal outcome.
          timeout 1800 aws deploy wait deployment-successful \
            --deployment-id $DEPLOYMENT_ID || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 124 ]; then
              echo "::error::Deployment $DEPLOYMENT_ID did not resolve within 1800s."
              echo "This is now treated as a failure rather than a guess — see INVEST-005/EPIC-017/FEATURE-002/US-089."
              echo "status=error" >> $GITHUB_OUTPUT
            else
              echo "⚠️ Wait command failed with exit code: $EXIT_CODE"
              echo "status=error" >> $GITHUB_OUTPUT
            fi
            exit 0  # Don't fail the step — the fail-on-error step below decides the job's fate
          }

          # If we get here, CodeDeploy itself reports the deployment succeeded.
          echo "✅ Deployment confirmed successful!"
          echo "status=success" >> $GITHUB_OUTPUT

      # INVEST-005/EPIC-017/FEATURE-002/US-007, phase 2 — **did the deployment actually take?**
      #
      # Everything before this reports on the deployment being *created*. None of it asks the
      # question a person actually has: is the service running the image this run just built?
      # ai-webstudio42 #189 answered "deployment created" and served the previous build for hours.
      #
      # **Only when the wait above resolved to `success`.** Since US-089, that only happens once
      # CodeDeploy itself reports the deployment finished — never while a blue/green shift is still
      # under way, so there is no "normal mismatch" case left to guard against here. If the wait
      # resolved to `error` instead, the job already fails via the step below; this check never runs
      # on an unconfirmed outcome.
      - name: 🔍 Verify the running image is the one we built
        if: steps.wait-deployment.outputs.status == 'success'
        env:
          # The image this run actually built, from the step that built it — there is no
          # `image_uri` input, and the service is named `service_name` here rather than
          # `ecs_service_name`. Both checked against the input list rather than assumed.
          EXPECTED_IMAGE: ${{ steps.build-image-uri.outputs.image_uri }}
        run: |
          TASK_DEF=$(aws ecs describe-services \
            --cluster "${{ inputs.cluster_name }}" \
            --services "${{ inputs.service_name }}" \
            --query 'services[0].taskDefinition' --output text)

          RUNNING_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF" \
            --query "taskDefinition.containerDefinitions[?name=='${{ inputs.container_name }}'].image | [0]" \
            --output text)

          echo "expected: ${EXPECTED_IMAGE}"
          echo "running:  ${RUNNING_IMAGE}"

          if [ "$RUNNING_IMAGE" = "$EXPECTED_IMAGE" ]; then
            echo "✅ The service is running the image this run built."
            exit 0
          fi

          echo "::error::The deployment reported success, but the service is not running the image this run built."
          echo ""
          echo "  expected: ${EXPECTED_IMAGE}"
          echo "  running:  ${RUNNING_IMAGE}"
          echo "  service:  ${{ inputs.service_name }}"
          echo ""
          echo "A green deployment that did not replace the image is the failure this check exists"
          echo "to make visible — see INVEST-005/EPIC-017/FEATURE-002/US-007."
          exit 1

      # The counterpart to the step above: a run that could not confirm the outcome says so loudly,
      # right next to the "✅ Fail on deployment error" step below that actually fails the job for
      # it — since US-089 this branch only means the deployment failed, was rolled back, or never
      # resolved inside the 30-minute ceiling. There is no longer a "still in progress, that's
      # normal" case that reaches here; every job depending on this one (including every
      # Lambda-deploy job) is about to be skipped, not merely informed.
      - name: ℹ️ Could not confirm the deployment succeeded
        if: steps.wait-deployment.outputs.status != 'success'
        run: |
          echo "::error::The deployment's outcome could not be confirmed as successful — failing"
          echo "this job so nothing that depends on it (including any Lambda deploy) proceeds on an"
          echo "unconfirmed outcome. See the Deployment Summary below and the AWS CodeDeploy console"
          echo "for the deployment this run created."

      - name: 📊 Display Deployment Summary
        if: always()
        run: |
          DEPLOYMENT_ID="${{ steps.create-deployment.outputs.deployment_id }}"
          TASK_DEF_ARN="${{ steps.register-taskdef.outputs.task_def_arn }}"
          CONSOLE_URL="${{ steps.create-deployment.outputs.console_url }}"
          WAIT_STATUS="${{ steps.wait-deployment.outputs.status }}"
          
          echo "### ECS CodeDeploy Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`${{ inputs.service_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** \`${{ inputs.cluster_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ inputs.ecr_repository }}:${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.create-deployment.outcome }}" == "success" ]; then
            echo "**Status:** 🟢 Deployment Created" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Deployment ID:** \`$DEPLOYMENT_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "**Task Definition:** \`$TASK_DEF_ARN\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "$WAIT_STATUS" == "success" ]; then
              echo "**Outcome:** ✅ Confirmed by CodeDeploy" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Outcome:** ❌ Failed, or not confirmed within 30 minutes — see below" >> $GITHUB_STEP_SUMMARY
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **[View in AWS Console]($CONSOLE_URL)**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ steps.check-active.outcome }}" == "failure" ]; then
              echo "**Reason:** Active deployment already in progress" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ steps.load-appspec.outcome }}" == "failure" ]; then
              echo "**Reason:** AppSpec file not found at \`${{ inputs.appspec_path }}\`" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ steps.download-taskdef.outcome }}" == "failure" ]; then
              echo "**Reason:** Task Definition not found: \`${{ inputs.task_family }}\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Reason:** See logs for details" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      # `!= 'success'` rather than `== 'error'`: the same defensive style already used by the
      # "Could not confirm" step just above, so a future status value this script doesn't yet know
      # about fails the job rather than silently passing it.
      - name: ✅ Fail on deployment error
        if: steps.wait-deployment.outputs.status != 'success'
        run: |
          echo "❌ Deployment failed - check AWS CodeDeploy console for details"
          exit 1
